[project]
name = "resualign"
version = "1.0.0"
description = "Resume alignment and diagnosis tool"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
resualign = "resualign.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/resualign"]

[tool.coverage.report]
fail_under = 85
show_missing = true
