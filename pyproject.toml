[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resualign"
version = "1.0.0"
description = "Resume alignment and diagnosis tool"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "beautifulsoup4>=4.12.0",
    "colorama>=0.4.6",
    "mcp>=1.2.0,<2.0",
]

[project.optional-dependencies]
# Test/dev toolchain. Single source of truth for local dev and CI:
#   pip install -e ".[dev]"
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.6.0",
    "jsonschema>=4.18.0",
    "coverage>=7.0.0",
    "pycryptodome>=3.20.0",
    "ruff>=0.16.0",
]

[project.scripts]
resualign = "resualign.cli:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Conservative set: pycodestyle errors, pyflakes, import sorting. No style-overhaul rules.
select = ["E", "F", "I"]
# E501 ignored project-wide on purpose: 121 violations across ~60 files, mostly
# long prompt/URL/SQL/Chinese-text strings where wrapping adds churn and risk
# without functional value. Keeps the gate green without a style overhaul.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["E402"]  # sys.path bootstrap before imports (standalone scripts)
"src/resualign/api/__init__.py" = ["E402"]  # mid-module imports avoid circular deps: routers/services do `import resualign.api as api_module`

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: browser E2E suite (requires Playwright + Chromium, run with --e2e)",
]

[tool.coverage.run]
source = ["src/resualign"]

[tool.coverage.report]
fail_under = 85
show_missing = true
