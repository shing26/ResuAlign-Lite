 rx="15" fill="#331E16"/><text x="485" y="382" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="13" fill="#FF8A5B" font-weight="600" text-anchor="middle">fail-closed 门禁</text><rect x="968" y="88" width="568" height="300" rx="16" fill="#12171F" stroke="#252C37" stroke-width="1"/><text x="996" y="128" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="17" fill="#E9EEF5" font-weight="700">gate.py · 每条建议都要过这一关</text><text x="996" y="152" font-family="JetBrains Mono, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#98A2B3">纯 stdlib · 无网络 · 与 skill 仓字节级同步</text><rect x="992" y="174" width="520" height="66" rx="10" fill="#0E131A" stroke="#252C37" stroke-width="1"/><rect x="992" y="174" width="4" height="66" rx="2" fill="#3DDC97"/><text x="1012" y="201" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="14.5" fill="#E9EEF5" font-weight="600">modify · 保留原文事实</text><text x="1012" y="223" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12" fill="#98A2B3">provenance 命中：数字与经历都能回到主简历原文</text><rect x="1406" y="194" width="82" height="30" rx="15" fill="#123027"/><text x="1447" y="214" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12" fill="#3DDC97" font-weight="600" text-anchor="middle">通过</text><rect x="992" y="254" width="520" height="66" rx="10" fill="#0E131A" stroke="#252C37" stroke-width="1"/><rect x="992" y="254" width="4" height="66" rx="2" fill="#FF8A5B"/><text x="1012" y="281" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="14.5" fill="#E9EEF5" font-weight="600">modify · 新增无关数字</text><text x="1012" y="303" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12" fill="#98A2B3">未找到出处：不进入建议，标记「建议复核」</text><rect x="