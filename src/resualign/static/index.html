<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResuAlign - Career Studio</title>
  <link rel="stylesheet" href="/static/styles.css?v=25">
</head>
<body class="app-body">
  <div class="container app-shell">
    <aside class="app-rail" aria-label="主导航栏">
      <div class="rail-mark" aria-hidden="true">RA</div>
      <nav class="tabs tabs--rail" aria-label="主导航">
        <button type="button" data-route="dashboard" aria-selected="false" title="工作台总览" aria-label="工作台总览">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span class="rail-label">工作台总览</span>
        </button>
        <button type="button" data-route="workspace" aria-selected="false" title="工作台" aria-label="工作台">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          <span class="rail-label">工作台</span>
        </button>
        <button type="button" data-route="jobs" aria-selected="false" title="岗位库" aria-label="岗位库">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>
          <span class="rail-label">岗位库</span>
        </button>
        <button type="button" data-route="resume" aria-selected="true" title="简历中心" aria-label="简历中心">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
          <span class="rail-label">简历中心</span>
        </button>
        <button type="button" data-route="settings" aria-selected="false" title="系统设置" aria-label="系统设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="20" cy="14" r="2"/></svg>
          <span class="rail-label">系统设置</span>
        </button>
      </nav>
      <div class="rail-foot" title="本地 · 个人模式">
        <span class="rail-dot" aria-hidden="true"></span>
      </div>
    </aside>
    <div class="app-main">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">RA</span>
          <div>
            <h1>ResuAlign</h1>
            <p class="tagline">求职工作台</p>
          </div>
        </div>
        <div class="command-bar">
          <button
            type="button"
            class="command-bar__trigger"
            data-action="open-command-panel"
            data-command-trigger
            aria-haspopup="dialog"
            aria-label="打开万能输入"
            title="打开万能输入"
          >
            <span class="command-bar__icon" aria-hidden="true"></span>
            <span class="command-bar__label">粘贴 JD 或输入岗位链接...</span>
            <kbd class="command-bar__kbd">Ctrl K</kbd>
          </button>
        </div>
        <select class="header-job-select" data-header-job-select aria-label="切换岗位" title="切换岗位">
          <option value="">选择岗位...</option>
        </select>
        <div class="topbar-actions">
          <button class="theme-toggle" type="button" data-action="toggle-theme" data-theme-toggle aria-pressed="false" aria-label="切换明暗主题" title="切换明暗主题">
            <span class="theme-toggle-icon" aria-hidden="true">◐</span>
            <span data-theme-label>浅色</span>
          </button>
          <div class="model-status">
            <span class="dot" aria-hidden="true"></span>
            <span id="mode-label">个人模式</span>
          </div>
        </div>
      </header>
      <main id="app-router-view" aria-live="polite"></main>
    </div>
  </div>
  <div id="print-root" class="print-root" aria-hidden="true"></div>
  <div id="toast-region" class="toast-region" aria-live="assertive"></div>
  <div
    class="command-palette"
    data-command-palette
    role="presentation"
    hidden
  >
    <div class="command-palette__dialog" role="dialog" aria-modal="true" aria-label="万能输入">
      <form class="command-palette__form" data-form="command-panel">
        <div class="command-palette__input-row">
          <span class="command-palette__glyph" aria-hidden="true"></span>
          <input
            type="text"
            name="command"
            data-command-input
            autocomplete="off"
            spellcheck="false"
            placeholder="粘贴 JD 文本或输入 JD 链接，Cmd/Ctrl+K 快速开启..."
          >
          <kbd>Esc</kbd>
        </div>
        <div class="command-palette__suggestions" data-command-suggestions hidden></div>
        <div class="command-palette__preview" data-command-preview role="status" aria-live="polite"></div>
        <div class="command-palette__actions">
          <button type="button" class="btn btn-ghost" data-action="close-command-panel">取消</button>
          <button type="submit" class="btn btn-primary" data-command-confirm disabled>确认并生成分析</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="/static/app/main.js?v=25"></script>
</body>
</html>
