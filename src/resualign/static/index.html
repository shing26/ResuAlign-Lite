<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResuAlign - Career Studio</title>
  <link rel="icon" href="data:,">
  <!-- SH-11（2026-10-23）：在样式表加载前套用已保存主题，避免深色用户第一帧看到白屏。
       与 theme.js 共用 localStorage key（resualign_theme）；theme.js 启动后会再 applyTheme 一次（幂等）。 -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("resualign_theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = "dark";
        }
      } catch (error) {
        /* 存储被禁用时保持默认浅色，theme.js 运行期仍会处理 */
      }
    })();
  </script>
<link rel="stylesheet" href="/static/styles.css?v=74">
</head>
<body class="app-body app-shell">
  <aside class="app-rail rail" aria-label="主导航栏">
    <div class="rail-brand">
      <span class="rail-mark brand-mark" data-brand-icon="crosshair" aria-hidden="true"></span>
      <div class="rail-brand__text">
        <h1 class="brand-name">ResuAlign</h1>
        <span class="rail-brand__tagline brand-tag">Career Studio v3</span>
      </div>
    </div>
    <nav class="tabs tabs--rail nav" id="app-nav" aria-label="主导航">
      <button type="button" class="nav-btn" data-route="dashboard" data-tab="dashboard" aria-selected="true" title="驾驶舱" aria-label="驾驶舱">
        <span class="rail-icon" data-nav-icon="gauge" aria-hidden="true"></span>
        <span class="nav-index" aria-hidden="true">01</span>
        <span class="rail-label">驾驶舱</span>
      </button>
      <button type="button" class="nav-btn" data-route="review" data-tab="review" aria-selected="false" title="投递复盘" aria-label="投递复盘">
        <span class="rail-icon" data-nav-icon="clipboard-list" aria-hidden="true"></span>
        <span class="nav-index" aria-hidden="true">02</span>
        <span class="rail-label">投递复盘</span>
      </button>
      <button type="button" class="nav-btn" data-route="workspace" data-tab="workspace" aria-selected="false" title="对齐工作台" aria-label="对齐工作台">
        <span class="rail-icon" data-nav-icon="columns" aria-hidden="true"></span>
        <span class="nav-index" aria-hidden="true">03</span>
        <span class="rail-label">工作台</span>
      </button>
      <button type="button" class="nav-btn" data-route="jobs" data-tab="jobs" aria-selected="false" title="岗位库" aria-label="岗位库">
        <span class="rail-icon" data-nav-icon="briefcase" aria-hidden="true"></span>
        <span class="nav-index" aria-hidden="true">04</span>
        <span class="rail-label">岗位库</span>
        <span class="rail-count" data-jobs-rail-count hidden></span>
      </button>
      <button type="button" class="nav-btn" data-route="resume" data-tab="resume" aria-selected="false" title="简历中心" aria-label="简历中心">
        <span class="rail-icon" data-nav-icon="file-text" aria-hidden="true"></span>
        <span class="nav-index" aria-hidden="true">05</span>
        <span class="rail-label">简历中心</span>
      </button>
      <button type="button" class="nav-btn" data-route="settings" data-tab="settings" aria-selected="false" title="系统设置" aria-label="系统设置">
        <span class="rail-icon" data-nav-icon="settings" aria-hidden="true"></span>
        <span class="nav-index" aria-hidden="true">06</span>
        <span class="rail-label">系统设置</span>
      </button>
    </nav>
    <div class="rail-foot" data-rail-foot>
      <div class="rail-funnel" data-rail-funnel hidden>
        <a class="count-pair" href="#/jobs?status=applied" aria-label="查看已投递的岗位">
          <span class="dot metric-dot metric-dot--applied" aria-hidden="true"></span>
          <span>已投递</span>
          <span class="count-pair__value" data-rail-funnel-applied>0</span>
        </a>
        <a class="count-pair" href="#/jobs?status=interview" aria-label="查看面试中的岗位">
          <span class="dot metric-dot metric-dot--interview" aria-hidden="true"></span>
          <span>面试中</span>
          <span class="count-pair__value" data-rail-funnel-interview>0</span>
        </a>
      </div>
      <div class="rail-foot__status">
        <span class="dot dot-success" aria-hidden="true"></span>
        <span>本地 · 个人模式</span>
        <span class="rail-tech">SQLite</span>
      </div>
    </div>
  </aside>
  <div class="app-main">
    <header class="topbar">
      <div class="topbar-title">
        <h2 id="page-title">驾驶舱</h2>
        <p id="page-subtitle">主简历与岗位对齐态势</p>
      </div>
      <div class="topbar-actions header-tools">
        <button type="button" class="command-bar cmd-trigger header-search" data-action="open-command-panel" data-command-trigger aria-haspopup="dialog" aria-label="打开万能输入" title="打开万能输入">
          <span class="command-glyph" aria-hidden="true">/</span>
          <span class="truncate">搜索岗位或命令...</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div class="topbar-actions__right">
          <button class="theme-toggle icon-btn" type="button" data-action="toggle-theme" data-theme-toggle aria-pressed="false" aria-label="切换明暗主题" title="切换明暗主题">
            <span class="theme-toggle-icon" data-theme-icon aria-hidden="true"></span>
            <span data-theme-label>浅色</span>
          </button>
        </div>
      </div>
    </header>
    <main id="app-router-view" aria-live="polite">
      <!-- SH-10（2026-10-23）：首屏静态骨架 —— boot() 要先等 /api/auth/me 才首次 render，
           这之前 #app-router-view 是空的（慢网/服务刚启动时是纯白屏）。先放同款骨架，
           render() 第一次运行时会整体替换掉。 -->
      <div class="view-skeleton" data-view-skeleton aria-busy="true" aria-label="正在加载页面">
        <div class="skeleton is-shimmer view-skeleton__bar"></div>
        <div class="view-skeleton__row">
          <div class="skeleton is-shimmer view-skeleton__card"></div>
          <div class="skeleton is-shimmer view-skeleton__card"></div>
          <div class="skeleton is-shimmer view-skeleton__card"></div>
        </div>
        <p class="view-skeleton__hint">正在加载…</p>
      </div>
    </main>
  </div>
  <div id="print-root" class="print-root" aria-hidden="true"></div>
  <div id="toast-region" class="toast-region" aria-live="assertive"></div>
  <div
    class="command-palette overlay"
    data-command-palette
    role="presentation"
    hidden
  >
    <div class="command-palette__dialog command-panel" role="dialog" aria-modal="true" aria-label="命令面板">
      <div class="command-palette__head">
        <span class="command-palette__title">命令面板</span>
        <span class="command-palette__hint">搜岗位 · 粘贴 JD 新建岗位 · 执行动作</span>
        <kbd class="command-palette__kbd">Ctrl K</kbd>
      </div>
      <form class="command-palette__form" data-form="command-panel">
        <div class="command-palette__input-row command-search">
          <span class="command-palette__glyph" aria-hidden="true">/</span>
          <textarea
            name="command"
            data-command-input
            rows="2"
            autocomplete="off"
            spellcheck="false"
            placeholder="搜索岗位、粘贴 JD，或输入命令"
          ></textarea>
          <kbd>Esc</kbd>
        </div>
        <div class="command-palette__suggestions command-groups" data-command-suggestions hidden></div>
        <div class="command-palette__preview command-foot" data-command-preview role="status" aria-live="polite"></div>
        <div class="command-palette__actions modal-actions">
          <button type="button" class="btn btn-ghost" data-action="close-command-panel">取消</button>
          <button type="button" class="btn btn-outline" data-action="quick-eval" title="规则打分，3 秒出结果，不建岗位">快速评估</button>
          <button type="submit" class="btn btn-primary" data-command-confirm disabled>确认</button>
        </div>
      </form>
    </div>
  </div>
<script type="module" src="/static/app/main.js?v=74"></script>
</body>
</html>
