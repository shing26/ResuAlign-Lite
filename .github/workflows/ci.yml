name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run tests with coverage gate
        run: python -m pytest --cov=resualign --cov-report=term-missing tests/
        env:
          PYTHONPATH: src
      - name: Offline benchmark
        run: python benchmarks/run_benchmark.py --offline
        env:
          PYTHONPATH: src
      - name: Frontend syntax check
        run: node --check src/resualign/static/app.js
      - name: Playwright smoke pass
        run: python .scratch/phase-16/playwright_smoke.py
        env:
          PYTHONPATH: src
